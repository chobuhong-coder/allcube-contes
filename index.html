<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올큐브 예약</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
  *{box-sizing:border-box;font-family:'Pretendard',system-ui,sans-serif;margin:0;padding:0}
  body{background:#F7F7F5;color:#0F1E3D}
  #wrap{max-width:520px;margin:0 auto;padding:32px 18px 60px}

  .head{text-align:center;margin-bottom:28px}
  .head h2{font-size:20px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px}
  .head p{font-size:13px;color:#8b95a9}

  .infoRow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .infoChip{background:#fff;border:1px solid #e7e2d6;border-radius:100px;padding:6px 13px;font-size:12px;font-weight:600;color:#4a5670}

  .sectionTitle{font-size:13.5px;font-weight:800;color:#0B1834;margin:0 0 12px}

  #calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  #calHead .calTitle{font-size:15px;font-weight:800}
  #calHead button{
    width:30px;height:30px;border-radius:50%;border:1px solid #e7e2d6;background:#fff;
    cursor:pointer;font-size:14px;color:#4a5670;display:grid;place-items:center;
  }
  #calHead button:disabled{opacity:.3;cursor:not-allowed}
  #calHead button:hover:not(:disabled){border-color:#2F6BFF;color:#2F6BFF}

  #calWeekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px}
  #calWeekdays span{font-size:11.5px;font-weight:700;color:#8b95a9}

  #calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:28px}
  .calCell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;
    border:1px solid transparent;transition:.15s;color:#0F1E3D;
  }
  .calCell.empty{visibility:hidden;cursor:default}
  .calCell.disabled{color:#c7cbd4;cursor:not-allowed}
  .calCell:hover:not(.disabled):not(.on){border-color:#2F6BFF;background:#EAF1FF}
  .calCell.today:not(.on){border-color:#2F6BFF;color:#2F6BFF}
  .calCell.on{background:#0B1834;color:#fff}

  #timeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
  .timeBtn{
    padding:14px 6px;border-radius:12px;border:1px solid #e7e2d6;background:#fff;cursor:pointer;
    text-align:center;transition:.15s;
  }
  .timeBtn .t{font-size:14.5px;font-weight:800}
  .timeBtn .left{font-size:11px;color:#2F6BFF;font-weight:700;margin-top:3px}
  .timeBtn:hover{border-color:#2F6BFF;transform:translateY(-2px)}
  .timeBtn.full{opacity:.4;cursor:not-allowed;background:#f3f1ea}
  .timeBtn.full:hover{transform:none;border-color:#e7e2d6}
  .timeBtn.full .left{color:#b0b6c2}

  /* 반(요일) 선택 카드 - 정규반처럼 특정 날짜가 아니라 요일반 자체에 정원이 걸리는 강의용 */
  #classGrid{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
  .classBtn{
    padding:16px 18px;border-radius:14px;border:1px solid #e7e2d6;background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;transition:.15s;
  }
  .classBtn:hover{border-color:#2F6BFF;transform:translateY(-2px)}
  .classBtn .label{font-size:15px;font-weight:800}
  .classBtn .time{font-size:12.5px;color:#8b95a9;font-weight:600;margin-top:2px}
  .classBtn .left{font-size:12.5px;color:#2F6BFF;font-weight:800}
  .classBtn.full{opacity:.45;cursor:not-allowed;background:#f3f1ea}
  .classBtn.full:hover{transform:none;border-color:#e7e2d6}
  .classBtn.full .left{color:#b0b6c2}

  #emptyMsg{font-size:13px;color:#9aa3b2;text-align:center;padding:20px 0}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(11,24,52,0.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:20px;padding:26px 22px;max-width:400px;width:100%}
  .modal h3{font-size:17px;font-weight:800;margin-bottom:4px}
  .modal .sub{font-size:12.5px;color:#8b95a9;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:#4a5670;margin-bottom:6px}
  .field input{
    width:100%;padding:11px 13px;border:1px solid #e7e2d6;border-radius:10px;font-size:14px;
    outline:none;transition:.15s;
  }
  .field input:focus{border-color:#2F6BFF}
  .modalBtns{display:flex;gap:8px;margin-top:18px}
  .btn{flex:1;padding:12px;border-radius:100px;border:none;font-size:13.5px;font-weight:800;cursor:pointer}
  .btnPrimary{background:#0B1834;color:#fff}
  .btnPrimary:disabled{opacity:.5;cursor:not-allowed}
  .btnGhost{background:#f3f1ea;color:#4a5670}
  .errMsg{color:#D01C28;font-size:12px;margin-top:8px;display:none}

  /* confirm screen */
  #confirmScreen{display:none;text-align:center}
  #confirmScreen .ic{
    width:56px;height:56px;border-radius:50%;background:#FFF7E0;color:#B98A00;
    display:grid;place-items:center;margin:0 auto 16px;font-size:26px;
  }
  #confirmScreen h2{font-size:21px;font-weight:800;margin-bottom:8px}
  #confirmScreen .timer{font-size:14px;font-weight:800;color:#D01C28;margin-bottom:4px}
  #confirmScreen .card{
    background:#fff;border:1px solid #e7e2d6;border-radius:16px;padding:18px 20px;margin:20px 0;
    text-align:left;font-size:13.5px;line-height:1.9;
  }
  #confirmScreen .card b{color:#0B1834}
  #confirmScreen .note{font-size:12px;color:#9aa3b2;margin-top:14px}
  #payBtn{
    display:block;width:100%;padding:15px;border:none;border-radius:100px;background:#0B1834;color:#fff;
    font-size:14.5px;font-weight:800;cursor:pointer;
  }

  #loading{text-align:center;padding:60px 0;color:#9aa3b2;font-size:13px}
</style>
</head>
<body>

<div id="wrap">

  <div id="loading">불러오는 중...</div>

  <div id="bookingScreen" style="display:none">
    <div class="head">
      <h2 id="courseName"></h2>
      <p id="courseDesc"></p>
    </div>
    <div class="infoRow" id="infoRow"></div>

    <!-- 날짜 기반(원데이 등) 강의용 화면 -->
    <div id="dateBasedScreen">
      <p class="sectionTitle">날짜 선택</p>
      <div id="calHead">
        <button id="calPrev" onclick="changeMonth(-1)">‹</button>
        <div class="calTitle" id="calTitle"></div>
        <button id="calNext" onclick="changeMonth(1)">›</button>
      </div>
      <div id="calWeekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calGrid"></div>

      <p class="sectionTitle">시간 선택</p>
      <div id="timeGrid"></div>
      <div id="emptyMsg" style="display:none">이 날짜엔 예약 가능한 시간이 없어요.</div>
    </div>

    <!-- 반(요일) 기반(정규반 등) 강의용 화면: 날짜가 아니라 반 자체에 정원이 걸림 -->
    <div id="classBasedScreen" style="display:none">
      <p class="sectionTitle">반 선택</p>
      <div id="classGrid"></div>
    </div>
  </div>

  <div id="confirmScreen">
    <div class="ic">⏳</div>
    <h2>시간이 임시로 확보됐어요!</h2>
    <p class="timer" id="cfTimer"></p>
    <div class="card">
      <div><b id="cfName"></b></div>
      <div id="cfDate"></div>
      <div id="cfLocation"></div>
    </div>
    <button id="payBtn" onclick="goToPayment()">결제하러 가기</button>
    <p class="note" id="cfContact"></p>
  </div>

</div>

<!-- 예약 정보 입력 모달 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p class="sub" id="modalSub"></p>
    <div class="field">
      <label>이름</label>
      <input type="text" id="fName" placeholder="이름을 입력해주세요">
    </div>
    <div class="field">
      <label>연락처</label>
      <input type="tel" id="fPhone" placeholder="010-0000-0000">
    </div>
    <div class="field">
      <label>이메일 (선택)</label>
      <input type="email" id="fEmail" placeholder="example@email.com">
    </div>
    <p class="errMsg" id="errMsg"></p>
    <div class="modalBtns">
      <button class="btn btnGhost" onclick="closeModal()">취소</button>
      <button class="btn btnPrimary" id="submitBtn" onclick="submitBooking()">예약 확정</button>
    </div>
  </div>
</div>

<script>
  // ====== 설정 ======
  const DB_URL = 'https://allcube-booking-default-rtdb.firebaseio.com';
  const COURSE_ID = 'oneday'; // 강의가 늘어나면 URL 쿼리 파라미터로 바꿔 받도록 확장 가능

  const DOW_KR = ['일','월','화','수','목','금','토'];

  let courseData = null;
  let selectedDate = null; // 'YYYY-MM-DD' (날짜기반) 또는 classKey (반기반)
  let selectedTime = null;
  let isRecurring = false; // 이 강의가 "반(요일) 기반" 정원 방식인지 여부

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

  async function init(){
    const params = new URLSearchParams(location.search);
    const courseId = params.get('course') || COURSE_ID;
    window.__courseId = courseId;

    const res = await fetch(`${DB_URL}/courses/${courseId}.json`);
    courseData = await res.json();

    if(!courseData){
      document.getElementById('loading').textContent = '강의 정보를 찾을 수 없습니다.';
      return;
    }

    document.getElementById('courseName').textContent = courseData.name;
    document.getElementById('courseDesc').textContent =
      (courseData.coachName ? courseData.coachName + ' 코치 · ' : '') + courseData.durationMin + '분 수업';

    const info = document.getElementById('infoRow');
    info.innerHTML = `
      <span class="infoChip">⏱ ${courseData.durationMin}분</span>
      <span class="infoChip">📍 ${courseData.location}</span>
    `;

    isRecurring = courseData.mode === 'recurring';

    if(isRecurring){
      document.getElementById('dateBasedScreen').style.display = 'none';
      document.getElementById('classBasedScreen').style.display = 'block';
      renderClassGrid();
    } else {
      document.getElementById('dateBasedScreen').style.display = 'block';
      document.getElementById('classBasedScreen').style.display = 'none';
      renderDateStrip();
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('bookingScreen').style.display = 'block';
  }

  let viewYear, viewMonth; // 캘린더에 표시 중인 연/월 (0-indexed month)
  let minDate, maxDate; // 예약 가능한 최소/최대 날짜 (Date, 시각 00:00)

  function renderDateStrip(){
    const today = new Date();
    today.setHours(0,0,0,0);
    const activeDays = courseData.activeDays || 30;

    minDate = new Date(today);
    maxDate = new Date(today);
    maxDate.setDate(today.getDate() + activeDays - 1);

    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    selectedDate = toDateStr(today);

    renderCalendar();
    loadTimesForDate(selectedDate);
  }

  function changeMonth(delta){
    let m = viewMonth + delta;
    let y = viewYear;
    if(m < 0){ m = 11; y--; }
    if(m > 11){ m = 0; y++; }
    viewYear = y; viewMonth = m;
    renderCalendar();
  }

  function renderCalendar(){
    document.getElementById('calTitle').textContent = `${viewYear}년 ${viewMonth+1}월`;

    // 이전/다음 버튼 활성/비활성 처리 (조회 가능 범위 밖으로는 못 나가게)
    const isMinMonth = (viewYear === minDate.getFullYear() && viewMonth === minDate.getMonth());
    const isMaxMonth = (viewYear === maxDate.getFullYear() && viewMonth === maxDate.getMonth());
    document.getElementById('calPrev').disabled = isMinMonth;
    document.getElementById('calNext').disabled = isMaxMonth;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const todayStr = toDateStr(new Date());

    for(let i = 0; i < startWeekday; i++){
      const empty = document.createElement('div');
      empty.className = 'calCell empty';
      grid.appendChild(empty);
    }

    for(let day = 1; day <= daysInMonth; day++){
      const cellDate = new Date(viewYear, viewMonth, day);
      cellDate.setHours(0,0,0,0);
      const dateStr = toDateStr(cellDate);
      const dow = cellDate.getDay();
      const hasSchedule = ((courseData.schedule && courseData.schedule[dow]) || []).length > 0;
      const inRange = cellDate >= minDate && cellDate <= maxDate;
      const disabled = !inRange || !hasSchedule;

      const cell = document.createElement('div');
      cell.className = 'calCell' + (disabled ? ' disabled' : '') + (dateStr === todayStr ? ' today' : '') + (dateStr === selectedDate ? ' on' : '');
      cell.textContent = day;
      if(!disabled){
        cell.onclick = () => selectDate(dateStr, cell);
      }
      grid.appendChild(cell);
    }
  }

  function selectDate(dateStr, cellEl){
    selectedDate = dateStr;
    document.querySelectorAll('.calCell').forEach(c => c.classList.remove('on'));
    cellEl.classList.add('on');
    loadTimesForDate(dateStr);
  }

  // ====== 정원 판단 로직 (날짜기반/반기반 공통 재사용) ======
  // "status가 정확히 confirmed일 때만 영구 유효", 그 외는 홀드시간(bookedAt+holdMinutes) 기준으로 판단.
  function isActiveEntry(entry, holdMinutes){
    if(!entry) return false;
    if(entry.status === 'confirmed') return true; // 결제 확정된 예약만 영구 유효

    const bookedMs = new Date(entry.bookedAt).getTime();
    if(isNaN(bookedMs)) return false; // bookedAt이 없거나 잘못된 값이면 자리 차지하지 않음 (안전한 기본값)
    return (Date.now() - bookedMs) < holdMinutes * 60000;
  }

  async function loadTimesForDate(dateStr){
    const grid = document.getElementById('timeGrid');
    const emptyMsg = document.getElementById('emptyMsg');
    grid.innerHTML = '';

    const d = new Date(dateStr + 'T00:00:00');
    const dow = d.getDay();
    const times = (courseData.schedule && courseData.schedule[dow]) || [];

    if(times.length === 0){
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    // 해당 날짜의 예약 현황 조회
    const res = await fetch(`${DB_URL}/bookings/${window.__courseId}/${dateStr}.json`);
    const bookingsForDate = (await res.json()) || {};

    const capacity = courseData.capacity || 1;
    const holdMinutes = courseData.holdMinutes || 15;

    times.forEach(t => {
      const entries = bookingsForDate[t] ? Object.values(bookingsForDate[t]) : [];
      const activeCount = entries.filter(e => isActiveEntry(e, holdMinutes)).length;
      const remaining = capacity - activeCount;
      const full = remaining <= 0;

      const btn = document.createElement('div');
      btn.className = 'timeBtn' + (full ? ' full' : '');
      btn.innerHTML = `<div class="t">${t}</div><div class="left">${full ? '마감' : remaining + '석 남음'}</div>`;
      if(!full){
        btn.onclick = () => openModal(t);
      }
      grid.appendChild(btn);
    });
  }

  // ====== 반(요일) 기반 강의 전용 로직 ======
  // 날짜별이 아니라 "월요일반/수요일반/금요일반" 같은 반 자체에 정원이 걸리는 방식.
  // Firebase 경로는 기존과 동일하게 /bookings/{courseId}/{classKey}/{time}/{id} 를 그대로 사용해서
  // admin.html / 결제확인 Worker와 100% 호환됨 (classKey를 "날짜" 자리에 그대로 끼워넣는 것뿐).
  // 특정 날짜가 아니라 classKey 자체가 고정된 주소이기 때문에, 몇 주가 지나도 같은 경로를 계속
  // 누적 집계하게 되어 "그 반이 찰 때까지 계속 마감 유지"가 자동으로 성립함.
  async function renderClassGrid(){
    const grid = document.getElementById('classGrid');
    grid.innerHTML = '';

    const classes = courseData.classes || {};
    const capacity = courseData.capacity || 1;
    const holdMinutes = courseData.holdMinutes || 15;
    const classKeys = Object.keys(classes);

    if(classKeys.length === 0){
      grid.innerHTML = '<div id="emptyMsg" style="display:block">아직 개설된 반이 없어요.</div>';
      return;
    }

    for(const classKey of classKeys){
      const cls = classes[classKey];
      const res = await fetch(`${DB_URL}/bookings/${window.__courseId}/${classKey}/${cls.time}.json`);
      const entries = res.ok ? Object.values((await res.json()) || {}) : [];
      const activeCount = entries.filter(e => isActiveEntry(e, holdMinutes)).length;
      const remaining = capacity - activeCount;
      const full = remaining <= 0;

      const btn = document.createElement('div');
      btn.className = 'classBtn' + (full ? ' full' : '');
      btn.innerHTML = `
        <div>
          <div class="label">${cls.label}</div>
          <div class="time">${cls.time}</div>
        </div>
        <div class="left">${full ? '마감' : remaining + '석 남음'}</div>
      `;
      if(!full){
        btn.onclick = () => openModal(cls.time, classKey, cls.label);
      }
      grid.appendChild(btn);
    }
  }

  function openModal(time, classKey, classLabel){
    selectedTime = time;
    if(isRecurring){
      selectedDate = classKey; // classKey를 그대로 "날짜 자리"에 사용 (Firebase 경로 재사용)
      document.getElementById('modalTitle').textContent = '등록 정보 입력';
      document.getElementById('modalSub').textContent = `${classLabel} · ${time}`;
    } else {
      document.getElementById('modalTitle').textContent = '예약 정보 입력';
      document.getElementById('modalSub').textContent =
        `${selectedDate} (${DOW_KR[new Date(selectedDate+'T00:00:00').getDay()]}) ${time}`;
    }
    document.getElementById('fName').value = '';
    document.getElementById('fPhone').value = '';
    document.getElementById('fEmail').value = '';
    document.getElementById('errMsg').style.display = 'none';
    document.getElementById('overlay').classList.add('on');
  }

  function closeModal(){
    document.getElementById('overlay').classList.remove('on');
  }

  let currentBookingId = null; // 방금 생성한 예약의 Firebase push ID (결제 연동에 사용)
  let currentClassLabel = null; // 반기반 강의일 때 확정화면에 보여줄 반 이름

  async function submitBooking(){
    const name = document.getElementById('fName').value.trim();
    const phone = document.getElementById('fPhone').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const errEl = document.getElementById('errMsg');
    const submitBtn = document.getElementById('submitBtn');

    if(!name || !phone){
      errEl.textContent = '이름과 연락처는 필수입니다.';
      errEl.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '처리 중...';

    try {
      const holdMinutes = courseData.holdMinutes || 15;

      // 제출 직전 재확인 (동시 예약 방지용 최소 보정)
      const checkRes = await fetch(`${DB_URL}/bookings/${window.__courseId}/${selectedDate}/${selectedTime}.json`);
      const current = (await checkRes.json()) || {};
      const currentActiveCount = Object.values(current).filter(e => isActiveEntry(e, holdMinutes)).length;
      const capacity = courseData.capacity || 1;

      if(currentActiveCount >= capacity){
        errEl.textContent = '방금 마감되었습니다. 다른 시간을 선택해주세요.';
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '예약 확정';
        closeModal();
        if(isRecurring){ renderClassGrid(); } else { loadTimesForDate(selectedDate); }
        return;
      }

      const body = {
        name, phone,
        ...(email ? { email } : {}),
        status: 'pending',
        bookedAt: new Date().toISOString()
      };

      const postRes = await fetch(`${DB_URL}/bookings/${window.__courseId}/${selectedDate}/${selectedTime}.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if(!postRes.ok) throw new Error('failed');

      const postResult = await postRes.json();
      currentBookingId = postResult.name; // Firebase가 생성한 push ID

      if(isRecurring){
        currentClassLabel = (courseData.classes && courseData.classes[selectedDate] && courseData.classes[selectedDate].label) || selectedDate;
      }

      showHold(name, holdMinutes);
    } catch(e){
      errEl.textContent = '예약 처리 중 오류가 발생했습니다. 다시 시도해주세요.';
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = '예약 확정';
    }
  }

  let holdTimerInterval = null;

  function showHold(name, holdMinutes){
    closeModal();
    document.getElementById('bookingScreen').style.display = 'none';
    document.getElementById('confirmScreen').style.display = 'block';

    document.getElementById('cfName').textContent = courseData.name;
    if(isRecurring){
      document.getElementById('cfDate').textContent = `${currentClassLabel} · ${selectedTime} (매주 반복)`;
    } else {
      const dow = DOW_KR[new Date(selectedDate+'T00:00:00').getDay()];
      document.getElementById('cfDate').textContent = `${selectedDate} (${dow}) ${selectedTime}`;
    }
    document.getElementById('cfLocation').textContent = `📍 ${courseData.location}`;
    document.getElementById('cfContact').textContent =
      `다른 분들도 이 시간을 기다리고 있어요. ${holdMinutes}분 안에 결제를 완료하지 않으면 예약이 자동 취소되고 다시 열립니다. 문의: ${courseData.contactPhone}`;

    const deadline = Date.now() + holdMinutes * 60000;
    const timerEl = document.getElementById('cfTimer');

    function tick(){
      const leftMs = deadline - Date.now();
      if(leftMs <= 0){
        timerEl.textContent = '예약 시간이 만료되어 다른 분에게 열렸습니다. 다시 선택해주세요.';
        document.getElementById('payBtn').disabled = true;
        clearInterval(holdTimerInterval);
        return;
      }
      const m = Math.floor(leftMs / 60000);
      const s = Math.floor((leftMs % 60000) / 1000);
      timerEl.textContent = `⏱ 남은 시간 ${m}:${s < 10 ? '0'+s : s}`;
    }
    tick();
    if(holdTimerInterval) clearInterval(holdTimerInterval);
    holdTimerInterval = setInterval(tick, 1000);
  }

  function goToPayment(){
    if(courseData.paymentUrl){
      // 예약 식별자를 결제 URL에 함께 실어보냄 (추후 자동 결제확인 연동 시 사용)
      const sep = courseData.paymentUrl.includes('?') ? '&' : '?';
      const url = `${courseData.paymentUrl}${sep}bcid=${encodeURIComponent(window.__courseId)}`
        + `&bdate=${encodeURIComponent(selectedDate)}`
        + `&btime=${encodeURIComponent(selectedTime)}`
        + `&bid=${encodeURIComponent(currentBookingId || '')}`;
      location.href = url;
    } else {
      alert('결제 페이지 연결이 아직 설정되지 않았습니다. ' + courseData.contactPhone + '로 문의해주세요.');
    }
  }

  init();
</script>
