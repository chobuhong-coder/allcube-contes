<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY ALLCUBE 위클리 콘테스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #F7F8FA; color: #0B1834; padding: 20px; min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .notice-bar {
    background: #fff; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.06); font-size: 13px; color: #888;
  }

  .header {
    background: linear-gradient(135deg, #0B1834 0%, #142954 100%);
    border-radius: 20px; padding: 24px; color: #fff; margin-bottom: 20px;
  }
  .header .badge {
    display: inline-block; background: #FFC844; color: #0B1834;
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    margin-bottom: 10px;
  }
  .header h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .header .countdown { font-size: 13px; color: rgba(255,255,255,0.7); }

  .scramble-box {
    background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.08);
  }
  .scramble-box .label { font-size: 12px; font-weight: 700; color: #2F6BFF; margin-bottom: 8px; }
  .scramble-box .text {
    font-family: 'Courier New', monospace; font-size: 20px; font-weight: 700;
    letter-spacing: 1px; line-height: 1.6; word-break: break-all;
  }

  .timer-box {
    background: #0B1834; border-radius: 20px; padding: 40px 20px;
    text-align: center; margin-bottom: 20px; user-select: none;
    transition: background 0.15s ease;
  }
  .timer-box.ready { background: #FFC844; }
  .timer-box.running { background: #159B4E; }
  .timer-box.locked { background: #ccc; }
  .timer-display { font-family: 'Courier New', monospace; font-size: 56px; font-weight: 800; color: #fff; }
  .timer-box.ready .timer-display, .timer-box.locked .timer-display { color: #0B1834; }
  .timer-hint { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 12px; }
  .timer-box.ready .timer-hint, .timer-box.locked .timer-hint { color: rgba(11,24,52,0.6); }

  .submit-box {
    background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.08); display: none;
  }
  .submit-box.show { display: block; }
  .submit-box .result-time { font-size: 28px; font-weight: 800; margin-bottom: 14px; }
  .submit-box input {
    width: 100%; padding: 12px 14px; border: 1px solid #E5E7EB; border-radius: 10px;
    font-size: 15px; margin-bottom: 10px;
  }
  .submit-box button {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: #2F6BFF; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .submit-box button:disabled { background: #ccc; cursor: not-allowed; }
  .submit-msg { font-size: 13px; margin-top: 8px; color: #159B4E; }

  .leaderboard {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.08);
  }
  .leaderboard h2 { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
  .lb-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid #F0F1F3; font-size: 14px;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    width: 28px; height: 28px; border-radius: 50%; background: #F0F1F3;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #666; flex-shrink: 0;
  }
  .lb-row.top1 .lb-rank { background: #FFC844; color: #0B1834; }
  .lb-row.top2 .lb-rank { background: #D9DDE3; color: #0B1834; }
  .lb-row.top3 .lb-rank { background: #E8C9A0; color: #0B1834; }
  .lb-name { flex: 1; font-weight: 600; }
  .lb-time { font-family: 'Courier New', monospace; font-weight: 700; color: #2F6BFF; }
  .lb-empty { color: #999; font-size: 14px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="notice-bar">이 페이지는 로그인한 플레이올큐브 회원만 볼 수 있어요. 아래에 닉네임만 입력하면 바로 참여할 수 있어요.</div>

  <div class="header">
    <div class="badge">위클리 콘테스트</div>
    <h1 id="weekTitle">이번 주 종목</h1>
    <div class="countdown" id="countdown">마감까지 계산 중...</div>
  </div>

  <div class="scramble-box">
    <div class="label">SCRAMBLE</div>
    <div class="text" id="scrambleText">불러오는 중...</div>
  </div>

  <div class="timer-box" id="timerBox">
    <div class="timer-display" id="timerDisplay">0.00</div>
    <div class="timer-hint" id="timerHint">스페이스바를 꾹 눌렀다 떼면 시작해요 (모바일은 탭)</div>
  </div>

  <div class="submit-box" id="submitBox">
    <div class="result-time" id="resultTime"></div>
    <input type="text" id="nicknameInput" placeholder="닉네임 (랭킹에 표시돼요)" maxlength="20">
    <button id="submitBtn">기록 제출하기</button>
    <div class="submit-msg" id="submitMsg"></div>
  </div>

  <div class="leaderboard">
    <h2>실시간 랭킹 (이번 주 최고 기록)</h2>
    <div id="leaderboardList"><div class="lb-empty">불러오는 중...</div></div>
  </div>
</div>

<script>
const DB_URL = 'https://allcube-booking-default-rtdb.firebaseio.com';
const DEVICE_ID_KEY = 'allcube_contest_device_id';
const NICKNAME_KEY = 'allcube_contest_nickname';

let weekKey = null;
let todayKey = null;
let deviceId = null;
let alreadySubmittedToday = false;

let state = 'idle';
let holdTimer = null;
let startTime = null;
let rafId = null;
let finalTime = 0;

// ---------- 유틸 ----------
function fmt(ms) { return (ms / 1000).toFixed(2); }
function todayDateKey() { return new Date().toLocaleDateString('en-CA'); }
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function getOrCreateDeviceId() {
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    localStorage.setItem(DEVICE_ID_KEY, id);
  }
  return id;
}

// ---------- 콘테스트 데이터 ----------
async function loadContest() {
  try {
    const res = await fetch(`${DB_URL}/contests/current.json`);
    const data = await res.json();
    if (!data) {
      document.getElementById('scrambleText').textContent = '아직 이번 주 콘테스트가 등록되지 않았어요.';
      return;
    }
    weekKey = data.weekLabel;
    todayKey = todayDateKey();
    document.getElementById('weekTitle').textContent = `이번 주 종목: ${data.eventName || data.event}`;
    document.getElementById('scrambleText').textContent = data.scramble;
    startCountdown(data.endAt);
    await checkTodaySubmission();
    loadLeaderboard();
  } catch (e) {
    document.getElementById('scrambleText').textContent = '콘테스트 정보를 불러오지 못했어요.';
  }
}

async function checkTodaySubmission() {
  try {
    const res = await fetch(`${DB_URL}/contestEntries/${encodeURIComponent(weekKey)}/${deviceId}/${todayKey}.json`);
    const data = await res.json();
    if (data) {
      alreadySubmittedToday = true;
      lockTimer(data.time);
    }
  } catch (e) { /* ignore */ }
}

function lockTimer(time) {
  const box = document.getElementById('timerBox');
  box.classList.add('locked');
  document.getElementById('timerDisplay').textContent = time.toFixed(2);
  document.getElementById('timerHint').textContent = '오늘은 이미 참여했어요. 내일 다시 도전해보세요!';
}

function startCountdown(endAt) {
  const end = new Date(endAt).getTime();
  const el = document.getElementById('countdown');
  function tick() {
    const diff = end - Date.now();
    if (diff <= 0) { el.textContent = '이번 주 콘테스트가 마감되었어요'; return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    el.textContent = `마감까지 ${d}일 ${h}시간 ${m}분 남음`;
  }
  tick();
  setInterval(tick, 60000);
}

async function loadLeaderboard() {
  if (!weekKey) return;
  try {
    const res = await fetch(`${DB_URL}/contestEntries/${encodeURIComponent(weekKey)}.json`);
    const data = await res.json();
    const listEl = document.getElementById('leaderboardList');
    if (!data) {
      listEl.innerHTML = '<div class="lb-empty">아직 제출된 기록이 없어요. 첫 기록의 주인공이 되어보세요!</div>';
      return;
    }
    const bestByUser = Object.entries(data).map(([id, days]) => {
      const dayEntries = Object.values(days);
      return dayEntries.reduce((a, b) => (a.time < b.time ? a : b));
    }).sort((a, b) => a.time - b.time);

    listEl.innerHTML = bestByUser.map((e, i) => {
      const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      return `<div class="lb-row ${rankClass}">
        <div class="lb-rank">${i + 1}</div>
        <div class="lb-name">${escapeHtml(e.nickname)}</div>
        <div class="lb-time">${e.time.toFixed(2)}초</div>
      </div>`;
    }).join('');
  } catch (e) { /* 다음 폴링에서 재시도 */ }
}

// ---------- 타이머 ----------
const timerBox = document.getElementById('timerBox');
const timerDisplay = document.getElementById('timerDisplay');
const timerHint = document.getElementById('timerHint');
const submitBox = document.getElementById('submitBox');
const resultTime = document.getElementById('resultTime');
const nicknameInput = document.getElementById('nicknameInput');
const submitBtn = document.getElementById('submitBtn');
const submitMsg = document.getElementById('submitMsg');

nicknameInput.value = localStorage.getItem(NICKNAME_KEY) || '';

function armReady() {
  if (alreadySubmittedToday) return;
  if (state !== 'idle') return;
  state = 'holding';
  holdTimer = setTimeout(() => {
    if (state === 'holding') {
      state = 'ready';
      timerBox.classList.add('ready');
      timerHint.textContent = '손을 떼면 시작해요!';
    }
  }, 300);
}
function cancelHold() {
  if (alreadySubmittedToday) return;
  clearTimeout(holdTimer);
  if (state === 'holding') { state = 'idle'; return; }
  if (state === 'ready') {
    state = 'running';
    timerBox.classList.remove('ready');
    timerBox.classList.add('running');
    timerHint.textContent = '눌러서 정지';
    startTime = performance.now();
    tickTimer();
    return;
  }
  if (state === 'running') {
    finalTime = performance.now() - startTime;
    cancelAnimationFrame(rafId);
    state = 'stopped';
    timerBox.classList.remove('running');
    timerDisplay.textContent = fmt(finalTime);
    timerHint.textContent = '다시 누르면 재도전 (제출 전까지는 자유롭게 다시 잴 수 있어요)';
    showSubmit(finalTime);
  }
}
function tickTimer() {
  timerDisplay.textContent = fmt(performance.now() - startTime);
  rafId = requestAnimationFrame(tickTimer);
}
function showSubmit(ms) {
  resultTime.textContent = `기록: ${fmt(ms)}초`;
  submitMsg.textContent = '';
  submitBtn.disabled = false;
  submitBox.classList.add('show');
}

document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); armReady(); } });
document.addEventListener('keyup', (e) => { if (e.code === 'Space') { e.preventDefault(); cancelHold(); } });
timerBox.addEventListener('touchstart', (e) => { e.preventDefault(); armReady(); });
timerBox.addEventListener('touchend', (e) => { e.preventDefault(); cancelHold(); });

submitBtn.addEventListener('click', async () => {
  const nickname = nicknameInput.value.trim();
  if (!nickname) { submitMsg.style.color = '#D01C28'; submitMsg.textContent = '닉네임을 입력해주세요.'; return; }
  if (!weekKey) return;

  localStorage.setItem(NICKNAME_KEY, nickname);
  submitBtn.disabled = true;
  submitMsg.style.color = '#159B4E';
  submitMsg.textContent = '제출 중...';

  try {
    const res = await fetch(`${DB_URL}/contestEntries/${encodeURIComponent(weekKey)}/${deviceId}/${todayKey}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname, time: finalTime / 1000, submittedAt: new Date().toISOString() })
    });
    if (!res.ok) {
      submitMsg.style.color = '#D01C28';
      submitMsg.textContent = '오늘은 이미 제출했거나 오류가 발생했어요.';
      submitBtn.disabled = false;
      return;
    }
    alreadySubmittedToday = true;
    lockTimer(finalTime / 1000);
    submitMsg.textContent = '기록이 등록됐어요! 내일 또 도전해보세요.';
    loadLeaderboard();
  } catch (e) {
    submitMsg.style.color = '#D01C28';
    submitMsg.textContent = '제출에 실패했어요. 다시 시도해주세요.';
    submitBtn.disabled = false;
  }
});

// ---------- 시작 ----------
deviceId = getOrCreateDeviceId();
loadContest();
setInterval(loadLeaderboard, 15000);
</script>
</body>
</html>
