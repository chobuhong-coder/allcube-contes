<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY ALLCUBE 위클리 콘테스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #F7F8FA; color: #0B1834; padding: 20px; min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  /* ---- 로그인/회원가입 ---- */
  .auth-box {
    background: #fff; border-radius: 20px; padding: 32px 24px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.08); max-width: 380px; margin: 40px auto;
  }
  .auth-box h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .auth-box .sub { font-size: 13px; color: #888; margin-bottom: 20px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .auth-tabs button {
    flex: 1; padding: 10px; border: 1px solid #E5E7EB; background: #fff;
    border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; color: #999;
  }
  .auth-tabs button.active { background: #0B1834; color: #fff; border-color: #0B1834; }
  .auth-box input {
    width: 100%; padding: 12px 14px; border: 1px solid #E5E7EB; border-radius: 10px;
    font-size: 15px; margin-bottom: 10px;
  }
  .auth-box button.submit {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: #2F6BFF; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .auth-box button.submit:disabled { background: #ccc; }
  .auth-msg { font-size: 13px; margin-top: 10px; color: #D01C28; min-height: 18px; }

  /* ---- 콘테스트 화면 ---- */
  .contest-area { display: none; }
  .contest-area.show { display: block; }

  .user-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.06); font-size: 14px;
  }
  .user-bar .name { font-weight: 700; }
  .user-bar button {
    background: none; border: none; color: #999; font-size: 13px; cursor: pointer;
    text-decoration: underline;
  }

  .header {
    background: linear-gradient(135deg, #0B1834 0%, #142954 100%);
    border-radius: 20px; padding: 24px; color: #fff; margin-bottom: 20px;
  }
  .header .badge {
    display: inline-block; background: #FFC844; color: #0B1834;
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    margin-bottom: 10px;
  }
  .header h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .header .countdown { font-size: 13px; color: rgba(255,255,255,0.7); }

  .scramble-box {
    background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.08);
  }
  .scramble-box .label { font-size: 12px; font-weight: 700; color: #2F6BFF; margin-bottom: 8px; }
  .scramble-box .text {
    font-family: 'Courier New', monospace; font-size: 20px; font-weight: 700;
    letter-spacing: 1px; line-height: 1.6; word-break: break-all;
  }

  .timer-box {
    background: #0B1834; border-radius: 20px; padding: 40px 20px;
    text-align: center; margin-bottom: 20px; user-select: none;
    transition: background 0.15s ease;
  }
  .timer-box.ready { background: #FFC844; }
  .timer-box.running { background: #159B4E; }
  .timer-box.locked { background: #ccc; }
  .timer-display { font-family: 'Courier New', monospace; font-size: 56px; font-weight: 800; color: #fff; }
  .timer-box.ready .timer-display, .timer-box.locked .timer-display { color: #0B1834; }
  .timer-hint { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 12px; }
  .timer-box.ready .timer-hint, .timer-box.locked .timer-hint { color: rgba(11,24,52,0.6); }

  .submit-box {
    background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.08); display: none;
  }
  .submit-box.show { display: block; }
  .submit-box .result-time { font-size: 28px; font-weight: 800; margin-bottom: 14px; }
  .submit-box button {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: #2F6BFF; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .submit-box button:disabled { background: #ccc; cursor: not-allowed; }
  .submit-msg { font-size: 13px; margin-top: 8px; color: #159B4E; }

  .leaderboard {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 4px 16px rgba(11,24,52,0.08);
  }
  .leaderboard h2 { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
  .lb-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid #F0F1F3; font-size: 14px;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    width: 28px; height: 28px; border-radius: 50%; background: #F0F1F3;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #666; flex-shrink: 0;
  }
  .lb-row.top1 .lb-rank { background: #FFC844; color: #0B1834; }
  .lb-row.top2 .lb-rank { background: #D9DDE3; color: #0B1834; }
  .lb-row.top3 .lb-rank { background: #E8C9A0; color: #0B1834; }
  .lb-name { flex: 1; font-weight: 600; }
  .lb-time { font-family: 'Courier New', monospace; font-weight: 700; color: #2F6BFF; }
  .lb-empty { color: #999; font-size: 14px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 / 회원가입 -->
  <div class="auth-box" id="authBox">
    <h1>위클리 콘테스트</h1>
    <div class="sub">참여하려면 로그인이 필요해요</div>
    <div class="auth-tabs">
      <button id="tabLogin" class="active">로그인</button>
      <button id="tabSignup">회원가입</button>
    </div>
    <input type="text" id="authId" placeholder="아이디 (영문/숫자, 랭킹에 표시돼요)" maxlength="20">
    <input type="password" id="authPw" placeholder="비밀번호 (6자 이상)">
    <button class="submit" id="authSubmit">로그인</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>

  <!-- 콘테스트 -->
  <div class="contest-area" id="contestArea">
    <div class="user-bar">
      <div><span class="name" id="userNameDisplay"></span>님, 환영해요!</div>
      <button id="logoutBtn">로그아웃</button>
    </div>

    <div class="header">
      <div class="badge">위클리 콘테스트</div>
      <h1 id="weekTitle">이번 주 종목</h1>
      <div class="countdown" id="countdown">마감까지 계산 중...</div>
    </div>

    <div class="scramble-box">
      <div class="label">SCRAMBLE</div>
      <div class="text" id="scrambleText">불러오는 중...</div>
    </div>

    <div class="timer-box" id="timerBox">
      <div class="timer-display" id="timerDisplay">0.00</div>
      <div class="timer-hint" id="timerHint">스페이스바를 꾹 눌렀다 떼면 시작해요 (모바일은 탭)</div>
    </div>

    <div class="submit-box" id="submitBox">
      <div class="result-time" id="resultTime"></div>
      <button id="submitBtn">이 기록으로 제출하기</button>
      <div class="submit-msg" id="submitMsg"></div>
    </div>

    <div class="leaderboard">
      <h2>실시간 랭킹 (이번 주 최고 기록)</h2>
      <div id="leaderboardList"><div class="lb-empty">불러오는 중...</div></div>
    </div>
  </div>
</div>

<script>
const DB_URL = 'https://allcube-booking-default-rtdb.firebaseio.com';
const API_KEY = 'AIzaSyDn5SBYcOfA3VbYyDyXE0hmAX9ah-DPRb0';
const FAKE_DOMAIN = '@allcube.local';
const AUTH_STORAGE_KEY = 'allcube_contest_auth';

let session = null; // { idToken, refreshToken, uid, nickname, expiresAt }
let currentContest = null;
let weekKey = null;
let todayKey = null;
let alreadySubmittedToday = false;

let state = 'idle';
let holdTimer = null;
let startTime = null;
let rafId = null;
let finalTime = 0;

// ---------- 유틸 ----------
function fmt(ms) { return (ms / 1000).toFixed(2); }
function sanitizeId(str) { return str.trim().toLowerCase().replace(/[^a-z0-9_-]/g, ''); }
function todayDateKey() { return new Date().toLocaleDateString('en-CA'); }
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- 인증 ----------
let authMode = 'login';
const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const authSubmit = document.getElementById('authSubmit');
const authMsg = document.getElementById('authMsg');

tabLogin.addEventListener('click', () => setAuthMode('login'));
tabSignup.addEventListener('click', () => setAuthMode('signup'));
function setAuthMode(mode) {
  authMode = mode;
  tabLogin.classList.toggle('active', mode === 'login');
  tabSignup.classList.toggle('active', mode === 'signup');
  authSubmit.textContent = mode === 'login' ? '로그인' : '회원가입';
  authMsg.textContent = '';
}

authSubmit.addEventListener('click', async () => {
  const rawId = document.getElementById('authId').value;
  const pw = document.getElementById('authPw').value;
  const id = sanitizeId(rawId);

  if (!id) { authMsg.textContent = '아이디는 영문/숫자만 입력해주세요.'; return; }
  if (pw.length < 6) { authMsg.textContent = '비밀번호는 6자 이상이어야 해요.'; return; }

  authSubmit.disabled = true;
  authMsg.style.color = '#666';
  authMsg.textContent = '처리 중...';

  const endpoint = authMode === 'login' ? 'signInWithPassword' : 'signUp';
  try {
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${endpoint}?key=${API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: id + FAKE_DOMAIN, password: pw, returnSecureToken: true })
    });
    const data = await res.json();
    if (data.error) {
      const msg = data.error.message;
      if (msg === 'EMAIL_EXISTS') authMsg.textContent = '이미 있는 아이디예요. 로그인해주세요.';
      else if (msg === 'EMAIL_NOT_FOUND' || msg === 'INVALID_PASSWORD' || msg === 'INVALID_LOGIN_CREDENTIALS') authMsg.textContent = '아이디 또는 비밀번호가 맞지 않아요.';
      else authMsg.textContent = '오류가 발생했어요: ' + msg;
      authSubmit.disabled = false;
      return;
    }
    saveSession(data.idToken, data.refreshToken, data.localId, id, Number(data.expiresIn));
    enterContest();
  } catch (e) {
    authMsg.textContent = '네트워크 오류가 발생했어요.';
    authSubmit.disabled = false;
  }
});

function saveSession(idToken, refreshToken, uid, nickname, expiresIn) {
  session = { idToken, refreshToken, uid, nickname, expiresAt: Date.now() + expiresIn * 1000 };
  localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
}

async function refreshSession() {
  const saved = localStorage.getItem(AUTH_STORAGE_KEY);
  if (!saved) return false;
  const s = JSON.parse(saved);
  try {
    const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=refresh_token&refresh_token=${s.refreshToken}`
    });
    const data = await res.json();
    if (data.error) return false;
    session = {
      idToken: data.id_token, refreshToken: data.refresh_token,
      uid: data.user_id, nickname: s.nickname,
      expiresAt: Date.now() + Number(data.expires_in) * 1000
    };
    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
    return true;
  } catch (e) { return false; }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem(AUTH_STORAGE_KEY);
  session = null;
  document.getElementById('contestArea').classList.remove('show');
  document.getElementById('authBox').style.display = 'block';
});

async function checkSession() {
  const saved = localStorage.getItem(AUTH_STORAGE_KEY);
  if (!saved) return false;
  session = JSON.parse(saved);
  if (Date.now() > session.expiresAt - 60000) {
    const ok = await refreshSession();
    if (!ok) { localStorage.removeItem(AUTH_STORAGE_KEY); return false; }
  }
  return true;
}

function enterContest() {
  document.getElementById('authBox').style.display = 'none';
  document.getElementById('contestArea').classList.add('show');
  document.getElementById('userNameDisplay').textContent = session.nickname;
  loadContest();
}

// ---------- 콘테스트 데이터 ----------
async function loadContest() {
  try {
    const res = await fetch(`${DB_URL}/contests/current.json`);
    const data = await res.json();
    if (!data) {
      document.getElementById('scrambleText').textContent = '아직 이번 주 콘테스트가 등록되지 않았어요.';
      return;
    }
    currentContest = data;
    weekKey = data.weekLabel;
    todayKey = todayDateKey();
    document.getElementById('weekTitle').textContent = `이번 주 종목: ${data.eventName || data.event}`;
    document.getElementById('scrambleText').textContent = data.scramble;
    startCountdown(data.endAt);
    await checkTodaySubmission();
    loadLeaderboard();
  } catch (e) {
    document.getElementById('scrambleText').textContent = '콘테스트 정보를 불러오지 못했어요.';
  }
}

async function checkTodaySubmission() {
  try {
    const res = await fetch(`${DB_URL}/contestEntries/${encodeURIComponent(weekKey)}/${session.uid}/${todayKey}.json?auth=${session.idToken}`);
    const data = await res.json();
    if (data) {
      alreadySubmittedToday = true;
      lockTimer(data.time);
    }
  } catch (e) { /* ignore */ }
}

function lockTimer(time) {
  const box = document.getElementById('timerBox');
  box.classList.add('locked');
  document.getElementById('timerDisplay').textContent = time.toFixed(2);
  document.getElementById('timerHint').textContent = '오늘은 이미 참여했어요. 내일 다시 도전해보세요!';
}

function startCountdown(endAt) {
  const end = new Date(endAt).getTime();
  const el = document.getElementById('countdown');
  function tick() {
    const diff = end - Date.now();
    if (diff <= 0) { el.textContent = '이번 주 콘테스트가 마감되었어요'; return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    el.textContent = `마감까지 ${d}일 ${h}시간 ${m}분 남음`;
  }
  tick();
  setInterval(tick, 60000);
}

async function loadLeaderboard() {
  if (!weekKey) return;
  try {
    const res = await fetch(`${DB_URL}/contestEntries/${encodeURIComponent(weekKey)}.json`);
    const data = await res.json();
    const listEl = document.getElementById('leaderboardList');
    if (!data) {
      listEl.innerHTML = '<div class="lb-empty">아직 제출된 기록이 없어요. 첫 기록의 주인공이 되어보세요!</div>';
      return;
    }
    // 유저별(uid) 여러 날짜 기록 중 베스트만 추출
    const bestByUser = Object.entries(data).map(([uid, days]) => {
      const dayEntries = Object.values(days);
      const best = dayEntries.reduce((a, b) => (a.time < b.time ? a : b));
      return best;
    }).sort((a, b) => a.time - b.time);

    listEl.innerHTML = bestByUser.map((e, i) => {
      const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      return `<div class="lb-row ${rankClass}">
        <div class="lb-rank">${i + 1}</div>
        <div class="lb-name">${escapeHtml(e.nickname)}</div>
        <div class="lb-time">${e.time.toFixed(2)}초</div>
      </div>`;
    }).join('');
  } catch (e) { /* 다음 폴링에서 재시도 */ }
}

// ---------- 타이머 ----------
const timerBox = document.getElementById('timerBox');
const timerDisplay = document.getElementById('timerDisplay');
const timerHint = document.getElementById('timerHint');
const submitBox = document.getElementById('submitBox');
const resultTime = document.getElementById('resultTime');
const submitBtn = document.getElementById('submitBtn');
const submitMsg = document.getElementById('submitMsg');

function armReady() {
  if (alreadySubmittedToday) return;
  if (state !== 'idle') return;
  state = 'holding';
  holdTimer = setTimeout(() => {
    if (state === 'holding') {
      state = 'ready';
      timerBox.classList.add('ready');
      timerHint.textContent = '손을 떼면 시작해요!';
    }
  }, 300);
}
function cancelHold() {
  if (alreadySubmittedToday) return;
  clearTimeout(holdTimer);
  if (state === 'holding') { state = 'idle'; return; }
  if (state === 'ready') {
    state = 'running';
    timerBox.classList.remove('ready');
    timerBox.classList.add('running');
    timerHint.textContent = '눌러서 정지';
    startTime = performance.now();
    tickTimer();
    return;
  }
  if (state === 'running') {
    finalTime = performance.now() - startTime;
    cancelAnimationFrame(rafId);
    state = 'stopped';
    timerBox.classList.remove('running');
    timerDisplay.textContent = fmt(finalTime);
    timerHint.textContent = '아래에서 제출해주세요 (하루 1회만 가능)';
    showSubmit(finalTime);
  }
}
function tickTimer() {
  timerDisplay.textContent = fmt(performance.now() - startTime);
  rafId = requestAnimationFrame(tickTimer);
}
function showSubmit(ms) {
  resultTime.textContent = `기록: ${fmt(ms)}초`;
  submitMsg.textContent = '';
  submitBtn.disabled = false;
  submitBox.classList.add('show');
}

document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); armReady(); } });
document.addEventListener('keyup', (e) => { if (e.code === 'Space') { e.preventDefault(); cancelHold(); } });
timerBox.addEventListener('touchstart', (e) => { e.preventDefault(); armReady(); });
timerBox.addEventListener('touchend', (e) => { e.preventDefault(); cancelHold(); });

submitBtn.addEventListener('click', async () => {
  if (!weekKey || !session) return;
  submitBtn.disabled = true;
  submitMsg.style.color = '#159B4E';
  submitMsg.textContent = '제출 중...';

  try {
    const res = await fetch(`${DB_URL}/contestEntries/${encodeURIComponent(weekKey)}/${session.uid}/${todayKey}.json?auth=${session.idToken}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nickname: session.nickname, time: finalTime / 1000, submittedAt: new Date().toISOString()
      })
    });
    if (!res.ok) {
      submitMsg.style.color = '#D01C28';
      submitMsg.textContent = '오늘은 이미 제출했거나 오류가 발생했어요.';
      submitBtn.disabled = false;
      return;
    }
    alreadySubmittedToday = true;
    lockTimer(finalTime / 1000);
    submitMsg.textContent = '기록이 등록됐어요! 내일 또 도전해보세요.';
    loadLeaderboard();
  } catch (e) {
    submitMsg.style.color = '#D01C28';
    submitMsg.textContent = '제출에 실패했어요. 다시 시도해주세요.';
    submitBtn.disabled = false;
  }
});

// ---------- 시작 ----------
(async () => {
  const ok = await checkSession();
  if (ok) enterContest();
  else document.getElementById('authBox').style.display = 'block';
})();

setInterval(loadLeaderboard, 15000);
</script>
</body>
</html>
